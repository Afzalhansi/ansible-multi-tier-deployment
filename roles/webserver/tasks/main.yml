---
- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: present

- name: Deploy app index page
  ansible.builtin.template:
    src: index.html.j2
    dest: /var/www/html/index.html
    mode: '0644'
  notify: Restart nginx

- name: Ensure nginx is running and enabled
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
